[project]
name = "meddocai"
version = "0.1.0"
description = "MedDocAI backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.103",
    "fastapi>=0.141.1",
    "gunicorn>=26.2.0",
    "passlib[bcrypt]>=1.7.4",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.1",
    "temporalio>=1.33.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
